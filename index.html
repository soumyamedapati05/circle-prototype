<style>
  :root { --cream: #faf7f0; --paper: #ffffff; --mint: #84e4be; --mint-soft: #e3f7ee; --mint-ink: #1f7a57; --ink: #331b0d; --ink-2: #6b5a4b; --ink-3: #a3968a; --tan: #8c7753; --hair: #ece6d9; --red: #b4432f; --radius: 14px; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 12px; background: #e7e1d4; font-family: Inter, -apple-system, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  #phone { width: 390px; height: 780px; margin: 0 auto; background: var(--cream); border-radius: 40px; box-shadow: 0 30px 60px rgba(51,27,13,.25), 0 0 0 10px #1c1612; overflow: hidden; display: flex; flex-direction: column; position: relative; }
  .status { height: 44px; display: flex; justify-content: space-between; align-items: center; padding: 0 28px; font-size: 13px; font-weight: 600; flex: none; }
  .screen { flex: 1; overflow-y: auto; padding: 4px 20px 24px; scrollbar-width: none; }

  .tabs button { flex: 1; position: relative; border: 0; background: none; font: inherit; font-size: 11px; font-weight: 500; color: var(--ink-3); cursor: pointer; padding: 6px 0; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .tabs button.on { color: var(--ink); }

  .tabs button.on svg { stroke: var(--mint-ink); }
  h1 { font-size: 26px; font-weight: 700; letter-spacing: -.02em; margin: 12px 0 4px; }
  h2 { font-size: 13px; font-weight: 600; color: var(--ink-2); margin: 22px 0 8px; }
  h3 { font-size: 16px; font-weight: 600; margin: 0; }
  p { margin: 0; line-height: 1.45; }
  .sub { color: var(--ink-2); font-size: 13px; }
  .tiny { color: var(--ink-3); font-size: 12px; }
  .logo { font-size: 44px; font-weight: 700; letter-spacing: -.04em; }
  .logo b { color: var(--mint); }
  .back { border: 0; background: none; font: inherit; font-size: 14px; color: var(--ink-2); padding: 8px 0; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .btn { width: 100%; border: 0; border-radius: 12px; padding: 15px; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 12px; }
  .btn.primary { background: var(--ink); color: #fff; }
  .btn.mint { background: var(--mint); color: var(--ink); }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .btn.soft { background: var(--paper); color: var(--ink); border: 1px solid var(--hair); }
  .btn.danger { background: transparent; color: var(--red); border: 1px solid #e6c9c3; }
  .btn.sm { width: auto; padding: 8px 14px; font-size: 13px; margin: 0; border-radius: 10px; white-space: nowrap; }
  .field { margin-top: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
  .field input, .field select, .field textarea { width: 100%; font: inherit; font-size: 15px; padding: 13px 14px; border: 1px solid var(--hair); border-radius: 12px; background: var(--paper); color: var(--ink); outline: none; }
  .field input:focus, .field textarea:focus { border-color: var(--ink); }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .card { background: var(--paper); border-radius: var(--radius); padding: 14px; margin-top: 10px; border: 1px solid var(--hair); }
  .card.tap { cursor: pointer; }
  .card.tap:active { transform: scale(.99); }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 0 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; border: 1px solid var(--hair); background: var(--paper); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer; color: var(--ink); }
  .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .search { display: flex; align-items: center; gap: 10px; background: var(--paper); border: 1px solid var(--hair); border-radius: 14px; padding: 12px 14px; margin-top: 10px; font-size: 14px; }
  .search input { border: 0; outline: 0; font: inherit; font-size: 14px; flex: 1; background: none; color: var(--ink); }
  .seg { display: flex; background: #efeadf; border-radius: 10px; padding: 3px; margin: 12px 0 4px; }
  .seg button { flex: 1; border: 0; background: none; font: inherit; font-size: 13px; font-weight: 500; padding: 7px; border-radius: 8px; cursor: pointer; color: var(--ink-2); }
  .seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .item { display: flex; gap: 12px; align-items: flex-start; }
  .thumb { flex: none; width: 76px; height: 76px; border-radius: 12px; background: linear-gradient(160deg, #f1ece0, #e2dac8); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; color: var(--tan); letter-spacing: .04em; overflow: hidden; }
  .thumb svg, .thumb img { width: 100%; height: 100%; display: block; }
  .thumb img { object-fit: cover; }
  .thumb.lg svg { padding: 10px; box-sizing: border-box; }
  .thumb.lg img { height: 100%; }
  .thumb.lg { width: 100%; height: 200px; border-radius: 18px; font-size: 13px; margin-top: 8px; }
  .thumb.sm { width: 64px; height: 64px; font-size: 10px; }
  .meta { flex: 1; min-width: 0; }
  .price { font-weight: 700; font-size: 15px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; background: var(--mint-soft); color: var(--mint-ink); vertical-align: middle; }
  .pill.grey { background: #efeadf; color: var(--ink-2); }
  .pill.warn { background: #fdf0d8; color: #8a5a00; }
  .pill.red { background: #fbe6e2; color: var(--red); }
  .star { color: #d9a400; }
  .list-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--hair); font-size: 14px; }
  .list-row:last-child { border-bottom: 0; }
  .list-row.total { font-weight: 700; border-top: 1px solid var(--ink); border-bottom: 0; margin-top: 4px; padding-top: 12px; }
  .toggle { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .switch { flex: none; width: 46px; height: 28px; border-radius: 999px; background: #d9d2c3; position: relative; cursor: pointer; border: 0; padding: 0; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s; }
  .switch.on { background: var(--mint-ink); }
  .switch.on::after { left: 21px; }
  .bar { position: absolute; left: 16px; right: 16px; bottom: 86px; background: var(--ink); color: #fff; border-radius: 16px; padding: 12px 12px 12px 18px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 12px 30px rgba(51,27,13,.3); font-size: 14px; }
  .bar .btn { margin: 0; width: auto; padding: 10px 16px; background: var(--mint); color: var(--ink); font-size: 14px; }
  .center { text-align: center; }
  .hero { padding: 40px 0 0; }
  .check { width: 72px; height: 72px; border-radius: 50%; background: var(--mint-soft); display: flex; align-items: center; justify-content: center; margin: 30px auto 16px; }
  .check svg { width: 34px; height: 34px; stroke: var(--mint-ink); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .upload { border: 1.5px dashed #cfc6b4; border-radius: 14px; padding: 26px; text-align: center; color: var(--ink-2); font-size: 13px; background: var(--paper); cursor: pointer; margin-top: 10px; }
  .upload.done { border-style: solid; border-color: var(--mint-ink); color: var(--mint-ink); background: var(--mint-soft); padding: 0; overflow: hidden; position: relative; }
  .upload.done img { display: block; width: 100%; height: 150px; object-fit: cover; }
  .upload.done .tag { position: absolute; left: 10px; bottom: 10px; background: var(--mint-ink); color: #fff; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; }
  .upload.done .retake { position: absolute; right: 10px; bottom: 10px; background: rgba(255,255,255,.9); color: var(--ink); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 999px; border: 0; cursor: pointer; }
  .upload.live { padding: 0; overflow: hidden; border-style: solid; border-color: var(--ink); }
  .upload.live video { display: block; width: 100%; height: 220px; object-fit: cover; background: #000; }
  .upload.live .ctl { display: flex; gap: 8px; padding: 10px; background: var(--paper); }
  .upload.live .ctl .btn { margin: 0; padding: 10px; font-size: 14px; }
  .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
  svg.map { width: 100%; height: auto; background: var(--paper); border-radius: 16px; border: 1px solid var(--hair); display: block; margin-top: 10px; }
  .lmap { height: 300px; border-radius: 16px; overflow: hidden; margin-top: 10px; border: 1px solid var(--hair); background: #eef0f3; }
  .lmap .leaflet-control-attribution { font: 9px Inter, sans-serif; background: rgba(255,255,255,.7); color: #999; }
  .lmap .leaflet-control-attribution a { color: #999; }
  .lmap .leaflet-bar { border: 0; box-shadow: 0 1px 4px rgba(0,0,0,.15); border-radius: 10px; overflow: hidden; }
  .lmap .leaflet-bar a { color: var(--ink); border-color: var(--hair); }
  .pinwrap { position: relative; width: 0; height: 0; }
  .pin { position: absolute; left: -16px; top: -40px; width: 32px; height: 32px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: var(--mint-ink); box-shadow: 0 3px 8px rgba(0,0,0,.25); border: 2px solid #fff; cursor: pointer; transition: transform .12s; }
  .pin span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; transform: rotate(45deg); color: #fff; font: 700 12px Inter, sans-serif; }
  .pinwrap.on .pin { background: var(--ink); transform: rotate(-45deg) scale(1.18); }
  .pinlabel { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 11px Inter, sans-serif; color: var(--ink); text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff; pointer-events: none; }
  .you { position: relative; width: 0; height: 0; }
  .you .dot { position: absolute; left: -8px; top: -8px; width: 16px; height: 16px; border-radius: 50%; background: #1a73e8; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
  .you .halo { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; background: rgba(26,115,232,.18); animation: pulse 2s ease-out infinite; }
  @keyframes pulse { 0% { transform: scale(.6); opacity: .9 } 100% { transform: scale(1.4); opacity: 0 } }
  svg.map .pin { cursor: pointer; }
  .msg { max-width: 80%; padding: 10px 14px; border-radius: 16px; margin-top: 8px; font-size: 14px; line-height: 1.4; }

function mapSvg(list) {
  const groups = {}; list.forEach(i => { (groups[i.lender] = groups[i.lender] || { ...i, items: [] }).items.push(i); }); PINS = Object.values(groups);
  const pins = PINS.map((g, idx) => `<g class="pin" onclick="S.pinLender=PINS[${idx}].lender;render()">

      <text x="${g.mx}" y="${g.below ? g.my + 25 : g.my - 16}" font-size="9" font-weight="500" text-anchor="middle" fill="#6b5a4b">${g.lender}</text></g>`).join("");
  return `<svg class="map" viewBox="0 0 320 220"><g stroke="#ece6d9" stroke-width="7" stroke-linecap="round"><line x1="20" y1="60" x2="300" y2="40"/><line x1="40" y1="120" x2="310" y2="105"/><line x1="60" y1="180" x2="300" y2="165"/><line x1="110" y1="10" x2="140" y2="210"/><line x1="200" y1="20" x2="225" y2="210"/></g>

}
function mapView(list) {
  if (typeof L === "undefined") return mapSvg(list);
  const groups = {}; list.forEach(i => { (groups[i.lender] = groups[i.lender] || { ...i, items: [] }).items.push(i); }); PINS = Object.values(groups);

}
function initMap() {
  const el = $.querySelector("#map"); if (!el || typeof L === "undefined") return;
  if (MAP) { try { MAP.remove(); } catch (e) {} MAP = null; }
  MAP = L.map(el, { zoomControl: false, attributionControl: true, scrollWheelZoom: false }).setView([40.7208, -73.9915], 16);
  const esri = "https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/";
  L.tileLayer(esri + "World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, attribution: "© Esri, HERE, OpenStreetMap" }).addTo(MAP);
  L.tileLayer(esri + "World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}", { maxZoom: 16, pane: "overlayPane", opacity: .9 }).addTo(MAP);
  L.marker([YOU.lat, YOU.lng], { icon: L.divIcon({ className: "", html: '<div class="you"><div class="halo"></div><div class="dot"></div></div>', iconSize: [0, 0] }), interactive: false, zIndexOffset: -100 }).addTo(MAP);
  PINS.forEach((g, idx) => {
    const on = S.pinLender === g.lender;
    const m = L.marker([g.lat, g.lng], { icon: L.divIcon({ className: "", html: `<div class="pinwrap ${on ? "on" : ""}"><div class="pin"><span>${g.items.length}</span></div><div class="pinlabel">${g.lender}</div></div>`, iconSize: [0, 0] }), zIndexOffset: on ? 500 : 0 }).addTo(MAP);
    m.on("click", () => { S.pinLender = g.lender; render(); });
  });
  const pts = PINS.map(g => [g.lat, g.lng]).concat([[YOU.lat, YOU.lng]]);
  MAP.fitBounds(L.latLngBounds(pts), { paddingTopLeft: [40, 56], paddingBottomRight: [40, 20], maxZoom: 16, animate: false });
  setTimeout(() => { if (MAP) MAP.invalidateSize(); }, 60);
}

      <div class="card"><div class="stars">${[1, 2, 3, 4, 5].map(n => `<span class="${S.draftStars >= n ? "on" : ""}" onclick="S.draftStars=${n};render()">★</span>`).join("")}</div>
      <div class="field"><label>Condition as described?</label><select><option>Yes, exactly</option><option>Mostly</option><option>No</option></select></div>
      <div class="field"><label>Pickup on time?</label><select><option>Yes</option><option>A few minutes late</option><option>No</option></select></div>
      <div class="field"><label>Anything else</label><textarea rows="3" placeholder="Dana was great, steamer heated up fast."></textarea></div></div>
      <button class="btn primary" onclick="submitReview(${r.id})">Post review</button>`;
  },
  chat: () => {
    const r = S.rentals.find(x => x.id === S.rental);
    return `<button class="back" onclick="go('rentalDetail')">‹ Back</button><h1 style="font-size:20px">${r.lender}</h1><p class="tiny">${r.items.map(id => item(id).name).join(", ")} · ${r.start}</p><div class="divider"></div>
      ${r.msgs.length ? r.msgs.map(([who, t, ts]) => `<div class="msg ${who}">${t}<span class="t">${ts}</span></div>`).join("") : `<p class="tiny center" style="margin-top:40px">No messages yet. Say hi, or ask about pickup.</p>`}
      <div class="compose"><input id="compose" placeholder="Message…" onkeydown="if(event.key==='Enter')sendMsg(${r.id})"><button onclick="sendMsg(${r.id})">↑</button></div>`;
  },
  listings: () => {
    const mine = myItems();
    return `<div style="display:flex;justify-content:space-between;align-items:flex-end"><div><h1 style="margin-top:4px">Your listings</h1><p class="sub">Lending as ${S.me} <span class="pill">✓ ID verified</span></p></div></div>
      <button class="btn mint" onclick="S.listing=false;S.listingImg=null;go('listItem')">+ List an item</button>
      ${mine.map(i => { const booked = [...S.requests, ...S.rentals.filter(r => r.lender === S.me)].filter(r => r.status === "approved" && r.items.includes(i.id)); return `<div class="card"><div class="item"><div class="thumb sm">${artFor(i)}</div><div class="meta">
        <div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:15px">${i.name}</h3>${booked.length ? `<span class="pill">Booked ${booked[0].start.slice(5)}</span>` : (i.blocked && i.blocked.length ? '<span class="pill warn">Dates blocked</span>' : '<span class="pill grey">Listed</span>')}</div>
        <div class="tiny" style="margin-top:2px">${i.sub} · $${i.price}/day · $${i.deposit} deposit · ${i.cond}</div>
        <div class="tiny">Pickup: ${i.slots.join(" · ")}</div>
        ${(i.blocked || []).map(([a, b], idx) => `<div class="tiny" style="margin-top:4px">Blocked ${a} to ${b} <button class="link" onclick="unblock(${i.id},${idx})">unblock</button></div>`).join("")}
        <div style="display:flex;gap:12px;margin-top:8px"><button class="link" onclick="S.blockTarget=${i.id};go('blockDates')">Block dates</button><button class="link" style="color:var(--ink-3)" onclick="removeListing(${i.id})">Remove</button></div>
      </div></div></div>`; }).join("")}`;
  },
  listItem: () => `<button class="back" onclick="stopCam();go('listings','listings')">‹ Listings</button><h1>List an item</h1><p class="sub">Takes about two minutes. You approve every request before anything is booked.</p>
    <h2>Photo</h2>${camTile("listing", "Tap to photograph the item", "Photo added")}
    <div class="row"><div class="field"><label>Category</label><select id="l_cat">${CATS.filter(c => c[0] !== "all").map(([k, v]) => `<option value="${k}">${v}</option>`).join("")}</select></div><div class="field"><label>Condition</label><select id="l_cond"><option>Good</option><option>Fair</option><option>Like new</option></select></div></div>
    <div class="field"><label>Item name</label><input id="l_name" placeholder="Rolling clothing rack"></div>
    <div class="field"><label>Short description</label><input id="l_sub" placeholder="Heavy duty, folds flat"></div>
    <div class="field"><label>Condition notes · shown to renters</label><input id="l_condnote" placeholder="Minor scuffs on base"></div>
    <div class="field"><label>Specs · comma separated</label><input id="l_specs" placeholder="Adjustable 50–65 in, holds ~60 lb"></div>
    <div class="row"><div class="field"><label>Price per day</label><input id="l_price" type="number" placeholder="12" min="1"></div><div class="field"><label>Deposit</label><input id="l_deposit" type="number" placeholder="40" min="0"></div></div>
    <div class="row"><div class="field"><label>Available from</label><input id="l_from" type="date" value="2026-10-15"></div><div class="field"><label>Until</label><input id="l_to" type="date" value="2026-12-31"></div></div>
    <div class="field"><label>Pickup slots you can do</label>${SLOT_OPTIONS.map(sl => `<label style="display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);padding:8px 0;border-bottom:1px solid var(--hair)"><input type="checkbox" name="l_slot" value="${sl}" style="width:auto;margin:0" ${LENDERS[S.me].slots.includes(sl) ? "checked" : ""}>${sl}</label>`).join("")}</div>
    <p class="tiny" style="margin-top:12px">Circle takes 10% of each rental. Deposits are held on the renter's card and released after your return check.</p>
    <button class="btn primary" onclick="submitListing()">Publish listing</button>`,
  blockDates: () => { const i = item(S.blockTarget); return `<button class="back" onclick="go('listings','listings')">‹ Listings</button><h1>Block dates</h1><p class="sub">${i.name} will disappear from search for these dates, for your own events or repairs.</p>
    <div class="row"><div class="field"><label>From</label><input id="b_from" type="date" value="2026-10-18"></div><div class="field"><label>To</label><input id="b_to" type="date" value="2026-10-19"></div></div>
    <button class="btn primary" onclick="blockDates(${i.id})">Block these dates</button>`; },
  requests: () => {
    const q = allRequests(); const open = q.filter(x => x.status === "requested"), done = q.filter(x => x.status !== "requested");
    const card = x => `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-size:15px">${x.renter}</h3>${x.status === "requested" ? '<span class="pill warn">Needs reply</span>' : statusPill(x.status === "declined" ? "cancelled" : x.status)}</div>
      <div style="margin-top:6px">${x.verified ? '<span class="pill">✓ ID verified</span>' : '<span class="pill grey">Not verified</span>'} <span class="tiny">${x.completed} completed · ${x.noShows} no-shows${x.rating ? " · ★ " + x.rating.toFixed(1) : " · new renter"}</span></div>
      <div class="divider"></div>
      ${x.items.map(id => `<div class="list-row"><span>${item(id) ? item(id).name : "Item"}</span><span class="tiny">$${item(id) ? item(id).price : 0}/day</span></div>`).join("")}
      <div class="list-row"><span>Dates</span><span>${x.start}${x.end !== x.start ? " to " + x.end : ""}</span></div><div class="list-row"><span>Pickup</span><span>${x.slot}</span></div><div class="list-row"><span>You earn</span><span><b>${money(netOf(x))}</b> <span class="tiny">after 10% fee</span></span></div>
      ${x.note ? `<p class="sub" style="margin-top:8px">“${x.note}”</p>` : ""}
      ${x.status === "requested" ? `<div class="row" style="margin-top:10px"><button class="btn danger" style="margin:0" onclick="decide(${x.id},'declined')">Decline</button><button class="btn mint" style="margin:0" onclick="decide(${x.id},'approved')">Approve</button></div>` : ""}</div>`;
    return `<h1 style="margin-top:4px">Requests</h1><p class="sub">Approve within 24 hours or the renter is refunded automatically.</p>${open.length ? open.map(card).join("") : '<p class="tiny" style="margin-top:14px">No open requests.</p>'}${done.length ? "<h2>Answered</h2>" + done.map(card).join("") : ""}`;
  },
  earnings: () => {
    const approved = allRequests().filter(x => x.status === "approved" || x.status === "returned");
    const net = netOf;
    const total = approved.reduce((s, x) => s + net(x), 0);
    return `<h1 style="margin-top:4px">Earnings</h1>
      <div class="card"><div class="row"><div class="stat"><b>${money(total)}</b><span>this month</span></div><div class="stat"><b>${approved.length}</b><span>bookings</span></div><div class="stat"><b>${myItems().length}</b><span>listed</span></div></div><div class="divider"></div><p class="tiny">Paid to your bank 2 days after each return check. Deposits never touch your account unless you file a claim.</p></div>
      <h2>Upcoming payouts</h2>${approved.length ? approved.map(x => `<div class="card" style="margin-top:0;margin-bottom:8px"><div class="toggle"><div><b style="font-size:14px">${x.renter}</b><div class="tiny">${x.items.map(id => item(id) ? item(id).name : "").join(", ")} · ${x.start}</div></div><b>${money(net(x))}</b></div></div>`).join("") : '<p class="tiny">Approve a request to see it here.</p>'}
      <h2>By item</h2><div class="card" style="margin-top:0">${myItems().map(i => `<div class="list-row"><span>${i.name}</span><span>${money(approved.filter(x => x.items.includes(i.id)).reduce((s, x) => s + i.price * daysBetween(x.start, x.end) * (1 - FEE), 0))}</span></div>`).join("")}</div>`;
  },
  inbox: () => `<h1 style="margin-top:4px">Messages</h1>${S.rentals.filter(r => r.msgs.length).map(r => `<div class="card tap" onclick="S.rental=${r.id};go('chat')"><div class="toggle"><div><b style="font-size:14px">${r.lender}</b><p class="sub" style="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px">${r.msgs[r.msgs.length - 1][1]}</p></div><span class="tiny">${r.msgs[r.msgs.length - 1][2].split(",")[0]}</span></div></div>`).join("") || `<p class="tiny">No conversations yet.</p>`}`,
  profile: () => {
    const u = S.user || { name: "Vicky Tran", verified: true }; const done = S.rentals.filter(r => r.status === "returned").length;
    return `<div style="display:flex;align-items:center;gap:14px;margin-top:16px"><div class="avatar">${S.selfieImg ? `<img src="${S.selfieImg}" alt="">` : u.name.split(" ").map(w => w[0]).join("")}</div><div><h1 style="margin:0;font-size:22px">${u.name}</h1><div class="tiny">Renter · Lower East Side · member since Sep 2026</div><div style="margin-top:6px">${u.verified ? '<span class="pill">✓ ID verified</span>' : '<span class="pill warn">Not verified</span> <button class="link" onclick="S.user=S.user||{name:\'Vicky Tran\'};go(\'verify\')">Verify now</button>'}</div></div></div>
      <h2>What lenders see</h2><div class="card" style="margin-top:0"><div class="row"><div class="stat"><b>${done + 3}</b><span>completed</span></div><div class="stat"><b>0</b><span>no-shows</span></div><div class="stat"><b>0</b><span>damage claims</span></div><div class="stat"><b>5.0</b><span>from lenders</span></div></div><div class="divider"></div><p class="tiny">Lenders see this summary, your verified badge, and your reviews from other lenders before they approve a request. They never see your ID or card details.</p></div>
      <h2>Reviews from lenders</h2><div class="card" style="margin-top:0"><div style="display:flex;justify-content:space-between"><b style="font-size:14px">Bowery Events Co.</b><span class="star">★★★★★</span></div><p class="sub" style="margin-top:4px">On time both ways, gear came back clean. Would lend again.</p></div>
      <h2>Account</h2><div class="card" style="margin-top:0"><div class="list-row"><span>Payment method</span><span class="tiny">Visa 4242</span></div><div class="list-row"><span>Default pickup area</span><span class="tiny">Delancey & Essex</span></div><div class="list-row"><span>Notifications</span><span class="tiny">Push + email</span></div></div>
      <div class="card"><div class="toggle"><div><b style="font-size:14px">${S.role === "lender" ? "Lending mode" : "Lend your gear"}</b><p class="tiny">${S.role === "lender" ? "Switch back to browse and rent." : "List items, approve requests and track earnings."}</p></div><button class="btn sm ${S.role === "lender" ? "soft" : "mint"}" onclick="switchRole('${S.role === "lender" ? "renter" : "lender"}')">${S.role === "lender" ? "Switch to renting" : "Start lending"}</button></div></div>
      <button class="btn soft" onclick="stopCam();S.user=null;S.idFront=false;S.selfie=false;S.idImg=null;S.selfieImg=null;go('welcome')">Sign out</button>`;
  },
};

function render() {
  const authless = ["welcome", "signup", "signin", "verify", "verified"];
  const showTabs = !authless.includes(S.screen);
  const tabDefs = S.role === "lender" ? [["listings", "Listings"], ["requests", "Requests"], ["earnings", "Earnings"], ["profile", "Profile"]] : [["explore", "Explore"], ["rentals", "Rentals"], ["inbox", "Inbox"], ["profile", "Profile"]];
  const openCount = S.role === "lender" ? allRequests().filter(x => x.status === "requested").length : 0;
  const tabs = showTabs ? `<div class="tabs">${tabDefs.map(([k, v]) => `<button class="${S.tab === k ? "on" : ""}" onclick="stopCam();go('${k}','${k}')">${ICON[k]}${v}${k === "requests" && openCount ? `<span class="pill" style="position:absolute;margin-left:28px;margin-top:-6px;padding:0 5px;background:var(--red);color:#fff">${openCount}</span>` : ""}</button>`).join("")}</div>` : "";
  const bar = cartBar();
  $.innerHTML = `<div class="status"><span>9:41</span><span>●●● ▲ ▮</span></div><div class="screen">${SCREENS[S.screen]()}</div>${bar}${tabs}<div class="toast ${bar ? "up" : ""}"></div>`;
  if (S.cam) attachCam();
  if (S.screen === "explore" && S.view === "map") initMap();
}
render();
</script>
</body>
</html>
